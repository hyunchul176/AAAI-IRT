scenario_type_dir: 'safebench/scenario/config/scenario_type'
scenario_type: 'adv_init_state.json'
scenario_category: 'planning'
policy_type: 'nf'

route_dir: 'safebench/scenario/scenario_data/route'
scenario_id: 2
route_id: null

ego_action_dim: 2
ego_state_dim: 4
ego_action_limit: 1.0

# for REINFORCE policy model
model_path: 'safebench/scenario/scenario_data/model_ckpt/nf'
model_id: 1
buffer_capacity: 100
batch_size: 32
lr: 0.001
eval_in_train_freq: 10
save_freq: 10
train_episode: 1000

# AAAI-IRT patch: NormalizingFlow.__init__이 use_prior·alpha·itr_per_train 세 필드를
# 요구하지만 SafeBench upstream nf.yaml에는 없음(NF 학습이 한 번도 검증되지
# 않은 자리). 합리적 default로 채움.
use_prior: True
alpha: 0.1
itr_per_train: 4
